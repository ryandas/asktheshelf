[project]
name = "asktheshelf"
version = "0.1.0"
description = "A RAG-powered chatbot that lets you query your technical book collection using natural language."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.99.0",
    "bs4>=0.0.2",
    "ddgs>=9.14.2",
    "deepagents>=0.5.7",
    "fastapi>=0.136.1",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "langchain-community>=0.4.1",
    "langchain-huggingface>=1.2.2",
    "langchain-pymupdf4llm>=0.5.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langchain[anthropic,google-genai]>=1.2.17",
    "llama-cloud>=2.5.0",
    "opencv-python>=4.13.0.92",
    "pymupdf-layout>=1.27.2.3",
    "pypdf>=6.11.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.2",
    "replicate>=1.0.7",
    "rich>=15.0.0",
    "sentence-transformers>=5.5.0",
    "tqdm>=4.67.3",
    "uvicorn[standard]>=0.47.0",
]
